# Example rule set for a trafficking/campaign service. Copy into
# governance/rules/ (not examples/) to activate.
rules:
  - name: high-budget-campaign
    version: 1
    description: Creating a campaign above 1,000,000 needs a human
    match: { service: trafficking, operation: createCampaign }
    conditions:
      budget: { greater_than: 1000000 }
    action: { type: REQUIRE_APPROVAL, reason: Campaign budget exceeds the approval threshold }

  - name: activate-campaign
    description: Going live is reviewed
    match: { service: trafficking, operation: activateCampaign }
    action: { type: REQUIRE_APPROVAL, reason: Activation changes live delivery }

  - name: attach-creative
    match: { service: trafficking, operation: attachCreative }
    action: { type: REQUIRE_APPROVAL, reason: Creative content must be reviewed }

  - name: finalize-campaign
    match: { service: trafficking, operation: finalizeCampaign }
    action: { type: ALLOW }

  - name: never-delete-campaigns
    match: { service: trafficking, method: DELETE, path: '/campaigns/{id}' }
    action: { type: DENY, reason: Campaign deletion is not permitted through agents }

  # Condition trees: allOf (AND), anyOf (OR), not (NOT), and computed operands.
  - name: large-share-or-long-flight
    description: A campaign taking more than 20% of the total budget, or flighting longer than 30 days, is reviewed — unless it is a dry run
    match: { service: trafficking, operation: createCampaign }
    conditions:
      allOf:
        - anyOf:
            - percent_of: { part: body.budget, whole: body.totalBudget }
              greater_than: 20
            - days_between: { from: body.startDate, to: body.endDate }
              greater_than: 30
        - not: { field: query.dryRun, equals: true }
    action: { type: REQUIRE_APPROVAL, reason: Large share of the total budget or a long flight }

  # A rule sees only the request Harbor is about to send; Harbor does not look
  # up the campaign's current bid. So this compares two fields of the same
  # request, and works only because this API's update carries both: the new
  # `bid` and the `currentBid` it replaces. The program writes that request, so
  # `currentBid` is its claim — a bid change that does not state it is
  # reviewed too (else leaving it out would skip the rule), and `bid-ceiling`
  # holds whatever it says.
  - name: bid-jump
    description: Raising a bid by more than 30% over the current bid the request states — or not stating it — is reviewed
    match: { service: trafficking, operation: updateCampaign }
    conditions:
      allOf:
        - { field: body.bid, exists: true }
        - anyOf:
            - ratio: { numerator: body.bid, denominator: body.currentBid }
              greater_than: 1.3
            - { field: body.currentBid, exists: false }
    action: { type: REQUIRE_APPROVAL, reason: 'Bid raised by more than 30% at once, or the current bid was not stated' }

  - name: bid-ceiling
    description: An absolute ceiling no claimed current bid can move
    match: { service: trafficking, operation: updateCampaign }
    conditions: { field: body.bid, greater_than: 50 }
    action: { type: REQUIRE_APPROVAL, reason: Bid above the absolute ceiling }

  # Levels. A gateway rule (no service, operation or path) covers every service;
  # `final: true` stops service and endpoint rules from overriding it.
  - name: no-bulk-deletes-anywhere
    description: No agent may delete through a collection endpoint, on any service
    match: { method: DELETE, path: '*' }
    conditions: { 'query.all': { equals: true } }
    final: true
    action: { type: DENY, reason: Bulk deletes are not permitted through agents }

  # A service rule covers every endpoint of the service; the endpoint rules above
  # override it wherever they match. Without this baseline the default decision
  # (DENY) would refuse every trafficking call that an endpoint rule targets but
  # does not match — e.g. a small createCampaign.
  - name: trafficking-baseline
    match: { service: trafficking }
    action: { type: ALLOW }

  # A subtree covers a template and every template beneath it.
  - name: campaign-writes-need-an-owner
    match: { service: trafficking, method: [POST, PUT, PATCH], path: '/campaigns/**' }
    conditions: { not: { field: body.owner, exists: true } }
    action: { type: DENY, reason: Campaign writes must name an owner }
