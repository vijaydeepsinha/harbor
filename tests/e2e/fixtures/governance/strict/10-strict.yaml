# Rule set for the fail-closed instance (GOVERNANCE_DEFAULT_DECISION=DENY).
# The DENY default applies only to a call one of these rules targets but none
# matches (NO_MATCHING_RULE) — e.g. a createOrder of 10000 or less. A call no
# rule here targets is ungoverned and allowed (NO_GOVERNANCE), not denied.
rules:
  - name: strict-allow-ping
    version: 1
    match: { operation: ping }
    action: { type: ALLOW }

  - name: strict-payment-requires-approval
    version: 1
    match: { service: commerce, operation: createPayment }
    action: { type: REQUIRE_APPROVAL, reason: Payments are reviewed on the strict instance }

  - name: strict-high-value-order-requires-approval
    version: 1
    match: { service: commerce, operation: createOrder }
    conditions:
      amount: { greater_than: 10000 }
    action: { type: REQUIRE_APPROVAL, reason: High-value orders are reviewed on the strict instance }
